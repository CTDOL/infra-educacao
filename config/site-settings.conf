# Configuracoes de site aplicadas pelo deploy (scripts/aplicar_config_site.sh).
# Aplicadas UMA VEZ por versao: o deploy so reaplica se SETTINGS_VERSION for maior
# que a ultima aplicada na VPS. Assim uma mudanca de emergencia (ex.: Break-Glass)
# nao e desfeita por um deploy comum. Para reaplicar: aumente a versao.
SETTINGS_VERSION=1
# Tema ativo (theme/ctdol e filho do Boost). Reverter: THEME=boost com versao maior.
THEME=ctdol
# 0 = esconde o formulario de login manual (so o botao "Entrar com Conta CTDOL").
# Nao altera o metodo de autenticacao (auth_oauth2/Keycloak segue intacto).
SHOW_LOGIN_FORM=0
